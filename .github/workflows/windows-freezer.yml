name: vb.freezer~ (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-freezer'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install FFTW (float, static) with vcpkg
        shell: pwsh
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install fftw3:x64-windows-static'

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build vb.freezer~
        shell: pwsh
        run: cmake --build build --config Release --target vb.freezer_tilde

      - name: Package
        shell: pwsh
        run: |
          $out = "dist/vb-objects/vb.freezer~"
          New-Item -ItemType Directory -Force -Path "$out/externals", "$out/help" | Out-Null
          Copy-Item "externals/vb.freezer~.mxe64" "$out/externals/"
          Copy-Item "help/vb.freezer~.maxhelp" "$out/help/"
          Copy-Item "README.md" "$out/"
          Compress-Archive -Path "$out" -DestinationPath "dist/vb.freezer-windows-x64.zip" -Force
          Get-ChildItem -Recurse dist

      - uses: actions/upload-artifact@v4
        with:
          name: vb.freezer-windows-x64
          path: dist/vb.freezer-windows-x64.zip

      - name: Publish release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/vb.freezer-windows-x64.zip --title "vb.freezer~ ${{ github.ref_name }} (Windows x64)" --notes "Windows x64 build of vb.freezer~. Unzip and put the folder in Documents/Max 9/Library (or any folder in Max's search path)."
